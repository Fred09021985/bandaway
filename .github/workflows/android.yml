name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer les ressources (Firebase, polices, icônes)
        run: |
          npm run build:vendor
          mkdir -p www/fonts
          cp node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2 www/fonts/space-grotesk.woff2
          cp node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2 www/fonts/inter.woff2
          mkdir -p assets
          npm run icons

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#07070f' --iconBackgroundColorDark '#07070f' \
            --splashBackgroundColor '#07070f' --splashBackgroundColorDark '#07070f'
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Bandaway.apk

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Bandaway-apk
          path: dist/Bandaway.apk

      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Bandaway ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          body: APK Android de Bandaway — télécharge `Bandaway.apk` et installe-le (autorise les sources inconnues).
          files: dist/Bandaway.apk
