name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK Android (préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer les ressources (Firebase, polices, icônes)
        run: |
          npm run build:vendor
          mkdir -p www/fonts
          cp node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2 www/fonts/space-grotesk.woff2
          cp node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2 www/fonts/inter.woff2
          mkdir -p assets
          npm run icons
          echo "export const APP_VERSION = ${{ github.run_number }};" > www/js/version.js

      - name: Paquet de mise à jour à distance (update.zip)
        run: |
          mkdir -p dist
          cd www && zip -qr ../dist/update.zip . && cd ..
          ls -la dist/update.zip

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#040b18' --iconBackgroundColorDark '#040b18' \
            --splashBackgroundColor '#040b18' --splashBackgroundColorDark '#040b18'
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Bandaway.apk

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v5
        with:
          name: Bandaway-apk
          path: dist/Bandaway.apk

      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Mes Cons ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          body: APK Android de Mes Cons — télécharge `Bandaway.apk` et installe-le (autorise les sources inconnues). `update.zip` sert aux mises à jour automatiques dans l'app.
          files: |
            dist/Bandaway.apk
            dist/update.zip
